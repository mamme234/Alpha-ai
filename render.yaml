# Render Blueprint for the AlphaAI inference server (see docs/DEPLOY.md §9–10).
#
# Render is the shortest path to a real inference host: it builds
# deploy/Dockerfile from this repository, attaches a persistent disk (the GGUF
# weights, which are never committed, must survive a restart) and serves HTTPS
# on *.onrender.com — no CLI and no local Docker required.
#
# Deploy: render.com → New → Blueprint → connect this repository. Render prompts
# for ALPHAI_INFERENCE_TOKEN below, then builds the image and starts the service.
#
# Cost before anything is charged: a persistent disk is not available on the
# free plan, and the free/starter instances (512 MB) cannot hold the ~1.3 GB
# resident model. `plan: standard` (2 GB RAM / 1 CPU) is the smallest instance
# this server fits on: about $25/month of compute plus $0.50/month for the 2 GB
# disk. Nothing runs until you press Apply with a payment method on the account.
services:
  - type: web
    name: alphaai-inference
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: standard
    # No health check path: Render's probe is an unauthenticated GET, and this
    # host answers 401 to any /api/* request that does not carry the shared
    # ALPHAI_INFERENCE_TOKEN (see alphaai/api/app.py). A protected host cannot
    # be probed without credentials, so Render instead marks the deploy live
    # when the port opens — and deploy/entrypoint.sh only starts the server
    # after the model has been copied, verified and load-tested, so listening
    # means the API is genuinely ready. `inference.ready` in the payload is the
    # model-level readiness signal and is reported honestly either way.
    # A persistent disk pins the service to a single instance; the container
    # writes its weights, memory store, logs and tool sandbox under /data.
    disk:
      name: alphaai-data
      mountPath: /data
      sizeGB: 2
    envVars:
      # Shared secret this host requires from the Vercel gateway. Set it here
      # and set the same value as ALPHAI_INFERENCE_TOKEN on the Vercel project.
      # Leave unset only to serve /api/* without a token.
      - key: ALPHAI_INFERENCE_TOKEN
        sync: false
      # Only needed when a browser calls this host from a different origin; the
      # same-origin routing in vercel.json never does.
      - key: ALPHAI_CORS_ORIGINS
        sync: false
